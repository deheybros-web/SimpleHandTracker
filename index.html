<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hand Tracker 1.0</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <main class="app">

        <h1>Hand Tracker 1.0</h1>
        <h2>By Mikhael Christo</h2>

        <p id="status">Loading...</p>

        <div class="camera-container">

            <video
                id="video"
                autoplay
                muted
                playsinline
            ></video>

            <canvas id="canvas"></canvas>

        </div>

        <!-- INFO -->

        <div class="info">

            <div>
                <span>Hands</span>
                <strong id="handCount">0</strong>
            </div>

            <div>
                <span>Camera</span>
                <strong id="cameraStatus">OFF</strong>
            </div>

            <div>
                <span>Gesture</span>
                <strong id="gesture">NONE</strong>
            </div>

        </div>

        <!-- ACCESS SYSTEM -->

        <div class="access-panel">


            <h3 id="accessStatus">
                WAITING FOR GESTURE CODE
            </h3>


        </div>

        <button id="startButton">
            Start Camera
        </button>

    </main>

    <script
        type="module"
        src="./script.js">
    </script>

</body>

</html>
